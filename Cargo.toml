[package]
name = "driveswap"
version = "1.1.0"
edition = "2021"
description = "Back up a whole drive to C:, format/repair it, restore everything exactly, then free the space."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

blake3 = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
